background_prompt: >
  Startr.Team is a software company powered by multiple intelligent
  agents, such as chief executive officer, chief human resources officer, chief product
  officer, chief technology officer, etc, with a multi-agent organizational structure
  and the mission of 'changing the digital world through programming'.

chain:
  - phase: DemandAnalysis
    phaseType: SimplePhase
    max_turn_step: -1
    need_reflect: true

  - phase: ChooseLanguage
    phaseType: SimplePhase
    max_turn_step: -1
    need_reflect: true

  - phase: Coding
    phaseType: SimplePhase
    max_turn_step: 1
    need_reflect: false

  - Composition:
    - phase: CodeThis
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    phase: CodeThisProject
    phaseType: ComposedPhase
    cycleNum: 10

  - Composition:
    - phase: CodeReviewComment
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    - phase: CodeReviewModification
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    phase: CodeReview
    phaseType: ComposedPhase
    cycleNum: 3

  - Composition:
    - phase: CodeReviewHuman
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    phase: HumanAgentInteraction
    phaseType: ComposedPhase
    cycleNum: 5

  - Composition:
    - phase: TestErrorSummary
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    - phase: TestModification
      phaseType: SimplePhase
      max_turn_step: 1
      need_reflect: false
    phase: Test
    phaseType: ComposedPhase
    cycleNum: 3

  - phase: EnvironmentDescription
    phaseType: SimplePhase
    max_turn_step: 1
    need_reflect: true

  - phase: Manual
    phaseType: SimplePhase
    max_turn_step: 1
    need_reflect: false

clear_structure: true
git_management: false
gui_design: true
incremental_develop: false

recruits:
  - Chief Executive Officer
  - Counselor
  - Chief Human Resource Officer
  - Chief Product Officer
  - Chief Technology Officer
  - Programmer
  - Code Reviewer
  - Software Test Engineer
  - Chief Creative Officer

self_improve: false
web_spider: false
with_memory: false
