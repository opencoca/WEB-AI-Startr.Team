# Base configuration used by all models
default_config: &default_config
  temperature: 0.7
  top_p: 1.0
  n: 1
  stream: false
  stop: null
  presence_penalty: 0.0
  frequency_penalty: 0.0
  is_openai: true
  max_tokens: 4096

# OpenAI specific configuration
openai_config: &openai_config
  <<: *default_config
  base_url: https://api.openai.com/v1
  is_openai: true

# Groq specific configuration
groq_config: &groq_config
  <<: *default_config
  base_url: https://api.groq.com/openai/v1
  is_openai: false

ollama_config: &ollama_config
  <<: *default_config
  base_url: http://localhost:8000/openai/v1
  is_openai: true
  
# Model definitions
models:
  GPT_3_5_TURBO:
    <<: *openai_config
    name: "gpt-3.5-turbo-16k-0613"
    max_tokens: 16384
  GPT_3_5_TURBO_NEW:
    <<: *openai_config
    name: "gpt-3.5-turbo-16k"
    max_tokens: 16384
  GPT_4:
    <<: *openai_config
    name: "gpt-4"
    max_tokens: 8192
  GPT_4_32K:
    <<: *openai_config
    name: "gpt-4-32k"
    max_tokens: 32768
  GPT_4_TURBO:
    <<: *openai_config
    name: "gpt-4-turbo"
    max_tokens: 100000
  GPT_4_TURBO_V:
    <<: *openai_config
    name: "gpt-4-turbo"
    max_tokens: 100000
  GPT_4O:
    <<: *openai_config
    name: "gpt-4o"
    max_tokens: 100000
  GPT_4O_MINI:
    <<: *openai_config
    name: "gpt-4o-mini"
    max_tokens: 100000
  STUB:
    <<: *default_config
    name: "stub"
    max_tokens: 4096
    is_openai: false
  LLAMA_3:
    <<: *groq_config
    name: "llama-3.3-70b-versatile"
    max_tokens: 32000