background: Startr.Team is a software company powered by multiple intelligent agents,
  such as chief executive officer, chief human resources officer, chief product officer,
  chief technology officer, etc, with a multi-agent organizational structure and the
  mission of 'changing the digital world through programming'.
process:
  phases:
  - name: DemandAnalysis
    type: SimplePhase
    max_turns: -1
    reflection: true
    assistant_role: Chief Product Officer
    user_role: Chief Executive Officer
    prompt: 'Startr.Team has made products in the following form before:

      Image: can present information in line chart, bar chart, flow chart, cloud chart,
      Gantt chart, etc.

      Document: can present information via .docx files.

      PowerPoint: can present information via .pptx files.

      Excel: can present information via .xlsx files.

      PDF: can present information via .pdf files.

      Website: can present personal resume, tutorial, products, or ideas, via .html
      files.

      Application: can implement visualized game, software, tool, etc, via python.

      Dashboard: can display a panel visualizing real-time information.

      Mind Map: can represent ideas, with related concepts arranged around a core
      concept.

      As the {assistant_role}, to satisfy the new user''s demand and the product should
      be realizable, you should keep discussing with me to decide which product modality
      do we want the product to be?

      Note that we must ONLY discuss the product modality and do not discuss anything
      else! Once we all have expressed our opinion(s) and agree with the results of
      the discussion unanimously, any of us must actively terminate the discussion
      by replying with only one line, which starts with a single word <INFO>, followed
      by our final product modality without any other words, e.g., "<INFO> PowerPoint".'
  - name: ChooseLanguage
    type: SimplePhase
    max_turns: -1
    reflection: true
    assistant_role: Chief Technology Officer
    user_role: Chief Executive Officer
    prompt: "According to the new user's task and some creative brainstorm ideas listed\
      \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nIdeas: \"{ideas}\"\
      .\nWe have decided to complete the task through a executable software implemented\
      \ via a programming language. \nAs the {assistant_role}, to satisfy the new\
      \ user's demand and make the software realizable, you should propose a concrete\
      \ programming language. If python can complete this task via Python, please\
      \ answer Python; otherwise, answer another programming language (e.g., Java,\
      \ C++, etc,).\nNote that we must ONLY discuss the target programming language\
      \ and do not discuss anything else! Once we all have expressed our opinion(s)\
      \ and agree with the results of the discussion unanimously, any of us must actively\
      \ terminate the discussion and conclude the best programming language we have\
      \ discussed without any other words or reasons, return only one line using the\
      \ format: \"<INFO> *\" where \"*\" represents a programming language."
  - name: Coding
    type: SimplePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: "Based on the new user's task and our software designs listed below:\n\
      Task: \"{task}\".\nTask Description: \"{description}\".\nModality: \"{modality}\"\
      .\nProgramming Language: \"{language}\"\nIdeas: \"{ideas}\"\nWe'll complete\
      \ this task with an executable software made up of multiple files written in\
      \ {language}. As the {assistant_role}, your job is to meet the user's demands\
      \ by writing one or more files and ensuring every part of the architecture is\
      \ fully implemented as code. {gui}\nThink through each step and make the right\
      \ decisions to get it done correctly.\nFirst, list the names of the core classes,\
      \ functions, and methods needed, along with a brief comment on their purpose.\n\
      Then, output the content of each file, including the full code. Each file must\
      \ follow this markdown code block format, replacing the following tokens: \"\
      FILENAME\" with the lowercase file name and extension, \"LANGUAGE\" with the\
      \ programming language, \"DOCSTRING\" with a string literal documenting a specific\
      \ part of the code, and \"CODE\" with the actual code:\nFILENAME\n```LANGUAGE\n\
      '''\nDOCSTRING\n'''\nCODE\n```\n\n**NOTE**: When writing in languages other\
      \ than Python, ensure comments or docstrings are included to explain the code,\
      \ but the syntax may differ, eg. JavaScript uses // for comments, html uses\
      \ <!-- -->, etc.\nRemember to follow the correct order of file creation and\
      \ code implementation. Start with the \"main\" file, then move to the files\
      \ imported by that one, and so on.\nFinally, ensure the code is fully functional.\
      \ Implement all functions\u2014no placeholders like 'pass' in Python."
  - name: CodeThisProject
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: Execute the CodeThisProject phase
    recursion:
      condition: needs_another_cycle
      max_depth: 10
      sub_phases:
      - name: CodeThis
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Chief Technology Officer
        prompt: "According to the new user's task and our software designs listed\
          \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
          \ \"{language}\"\nCodes:\n\"{codes}\"\nUnimplemented File:\n\"{unimplemented_file}\"\
          \nIn our software, each file must strictly follow a markdown code block\
          \ format, where the following tokens must be replaced such that \"FILENAME\"\
          \ is the lowercase file name including the file extension, \"LANGUAGE\"\
          \ in the programming language, \"DOCSTRING\" is a string literal specified\
          \ in source code that is used to document a specific segment of code, and\
          \ \"CODE\" is the original code:\nFILENAME\n```LANGUAGE\n'''\nDOCSTRING\n\
          '''\nCODE\n```\nAs the {assistant_role}, to satisfy the complete function\
          \ of our developed software, you have to implement all methods in the {unimplemented_file}\
          \ file which contains a unimplemented class. Now, implement all methods\
          \ of the {unimplemented_file} and all other code needed, then output the\
          \ fully implemented codes, strictly following the required format."
  - name: CodeReview
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Code Reviewer
    user_role: Programmer
    prompt: Execute the CodeReview phase
    recursion:
      condition: needs_another_cycle
      max_depth: 3
      sub_phases:
      - name: CodeReviewComment
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Code Reviewer
        user_role: Programmer
        prompt: "According to the new user's task and our software designs: \nTask:\
          \ \"{task}\".\nModality: \"{modality}\".\nProgramming Language: \"{language}\"\
          \nIdeas: \"{ideas}\"\nCodes:\n\"{codes}\"\nAs the {assistant_role}, to make\
          \ the software directly operable without further coding, Startr.Team have\
          \ formulated the following regulations:\n1) all referenced classes should\
          \ be imported;\n2) all methods should be implemented;\n3) all methods need\
          \ to have the necessary comments;\n4) no potential bugs;\n5) The entire\
          \ project conforms to the tasks proposed by the user;\n6) most importantly,\
          \ do not only check the errors in the code, but also the logic of code.\
          \ Make sure that user can interact with generated software without losing\
          \ any feature in the requirement;\nNow, you should check the above regulations\
          \ one by one and review the code in detail, propose one comment with the\
          \ highest priority about the codes, and give me instructions on how to fix.\
          \ Tell me your comment with the highest priority and corresponding suggestions\
          \ on revision. If the code is perfect and you have no comment for any of\
          \ it, return only one line like \"<INFO> Finished\"."
      - name: CodeReviewModification
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Code Reviewer
        prompt: "According to the new user's task, our designed product modality,\
          \ languages and ideas, our developed first-edition source code are listed\
          \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
          \ \"{language}\"\nIdeas: \"{ideas}\"\nCodes: \n\"{codes}\"\nComments on\
          \ Codes:\n\"{comments}\"\nIn the software, each file must strictly follow\
          \ a markdown code block format, where the following tokens must be replaced\
          \ such that \"FILENAME\" is the lowercase file name including the file extension,\
          \ \"LANGUAGE\" in the programming language, \"DOCSTRING\" is a string literal\
          \ specified in source code that is used to document a specific segment of\
          \ code, and \"CODE\" is the original code. Format:\nFILENAME\n```LANGUAGE\n\
          '''\nDOCSTRING\n'''\nCODE\n```\nAs the {assistant_role}, to satisfy the\
          \ new user's demand and make the software creative, executive and robust,\
          \ you should modify corresponding code according to the comments. Then,\
          \ output the full and complete code with all bugs fixed based on the comments.\
          \ Return all code strictly following the required format."
  - name: HumanAgentInteraction
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Code Reviewer
    prompt: Execute the HumanAgentInteraction phase
    recursion:
      condition: needs_another_cycle
      max_depth: 5
      sub_phases:
      - name: CodeReviewHuman
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Code Reviewer
        prompt: "According to the new user's task, our designed product modality and\
          \ three creative ideas, our developed first-edition source code are listed\
          \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
          \ \"{language}\"\nIdeas: \"{ideas}\"\nCodes: \n\"{codes}\"\nComments on\
          \ Codes:\n\"{comments}\"\nIn the software, each file must strictly follow\
          \ a markdown code block format, where the following tokens must be replaced\
          \ such that \"FILENAME\" is the lowercase file name including the file extension,\
          \ \"LANGUAGE\" in the programming language, \"DOCSTRING\" is a string literal\
          \ specified in source code that is used to document a specific segment of\
          \ code, and \"CODE\" is the original code. Format:\nFILENAME\n```LANGUAGE\n\
          '''\nDOCSTRING\n'''\nCODE\n```\nAs the {assistant_role}, to satisfy the\
          \ new user's demand and make the software creative, executive and robust,\
          \ you should modify corresponding code according to the comments. Then,\
          \ output the full and complete code with all bugs fixed based on the comments.\
          \ Return all code strictly following the required format."
  - name: Test
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Software Test Engineer
    prompt: Execute the Test phase
    recursion:
      condition: needs_another_cycle
      max_depth: 3
      sub_phases:
      - name: TestErrorSummary
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Software Test Engineer
        prompt: "Our developed source code and corresponding test reports are listed\
          \ below: \nProgramming Language: \"{language}\"\nSource Codes:\n\"{codes}\"\
          \nTest Reports of Source Codes:\n\"{test_reports}\"\nAccording to my test\
          \ reports, please locate and summarize the bugs that cause the problem."
      - name: TestModification
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Software Test Engineer
        prompt: "Our developed source code and corresponding test reports are listed\
          \ below: \nProgramming Language: \"{language}\"\nSource Codes:\n\"{codes}\"\
          \nTest Reports of Source Codes:\n\"{test_reports}\"\nError Summary of Test\
          \ Reports:\n\"{error_summary}\"\nNote that each file must strictly follow\
          \ a markdown code block format, where the following tokens must be replaced\
          \ such that \"FILENAME\" is the lowercase file name including the file extension,\
          \ \"LANGUAGE\" in the programming language, \"DOCSTRING\" is a string literal\
          \ specified in source code that is used to document a specific segment of\
          \ code, and \"CODE\" is the original code:\nFILENAME\n```LANGUAGE\n'''\n\
          DOCSTRING\n'''\nCODE\n```\nAs the {assistant_role}, to satisfy the new user's\
          \ demand and make the software execute smoothly and robustly, you should\
          \ modify the code based on the error summary. Now, use the format exemplified\
          \ above and modify the problematic code based on the error summary. Output\
          \ the code that you fixed based on the test reported and corresponding explanations\
          \ (strictly follow the format defined above, including FILENAME, LANGUAGE,\
          \ DOCSTRING and CODE; incomplete \"TODO\" code are strictly prohibited).\
          \ If no bugs are reported, please return only one line like \"<INFO> Finished\"\
          ."
  - name: EnvironmentDescription
    type: SimplePhase
    max_turns: 1
    reflection: true
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: "The new user's task and project code is as follows: \n\nTask: \"{task}\"\
      .\nModality: \"{modality}\".\nProgramming Language: \"{language}\"\nIdeas: \"\
      {ideas}\"\nCodes: \n\"{codes}\"\nAs the {assistant_role}, you should write a\
      \ requirements file, for example with npm and bun it would be a package.json\
      \ and for python a requirements.txt file, which is commonly used in Python projects\
      \ to specify the dependencies or packages required for the project to run properly.\
      \ It serves as a way to document and manage the project's dependencies in a\
      \ standardized format. For example:\n\nrequirements.txt\n```\nnumpy==1.19.2\n\
      pandas>=1.1.4\n```\n\nBased on our {language} project needs, write a requirements\
      \ file to specify the dependencies or packages required for the project to run\
      \ properly."
  - name: Manual
    type: SimplePhase
    max_turns: 1
    reflection: false
    assistant_role: Chief Product Officer
    user_role: Chief Executive Officer
    prompt: "The new user's task, our developed code and required dependencies are\
      \ listed: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
      \ \"{language}\"\nIdeas: \"{ideas}\"\nCodes: \n\"{codes}\"\nRequirements:\n\"\
      {requirements}\"\nAs the {assistant_role}, by using Markdown, you should write\
      \ a manual.md file which is a detailed user manual to use the software, including\
      \ introducing main functions of the software, how to install environment dependencies\
      \ and how to use/play it. For example:\nmanual.md\n```\n# LangChain\nBuilding\
      \ applications with LLMs through composability\nLooking for the JS/TS version?\
      \ Check out LangChain.js.\n**Production Support:** As you move your LangChains\
      \ into production, we'd love to offer more comprehensive support.\nPlease fill\
      \ out this form and we'll set up a dedicated support Slack channel.\n## Quick\
      \ Install\n`pip install langchain`\nor\n`conda install langchain -c conda-forge`\n\
      ## \U0001F914 What is this?\nLarge language models (LLMs) are emerging as a\
      \ transformative technology, enabling developers to build applications that\
      \ they previously could not. However, using these LLMs in isolation is often\
      \ insufficient for creating a truly powerful app - the real power comes when\
      \ you can combine them with other sources of computation or knowledge.\nThis\
      \ library aims to assist in the development of those types of applications.\
      \ Common examples of these applications include:\n**\u2753 Question Answering\
      \ over specific documents**\n- Documentation\n- End-to-end Example: Question\
      \ Answering over Notion Database\n**\U0001F916 Agents**\n- Documentation\n-\
      \ End-to-end Example: GPT+WolframAlpha\n## \U0001F4D6 Documentation\nPlease\
      \ see [here](https://python.langchain.com) for full documentation on:\n- Getting\
      \ started (installation, setting up the environment, simple examples)\n- How-To\
      \ examples (demos, integrations, helper functions)\n- Reference (full API docs)\n\
      - Resources (high-level explanation of core concepts)\n```"
agents: []
settings:
  clear_structure: true
  git_management: false
  gui_design: true
  incremental_develop: false
  self_improve: false
  web_spider: false
  with_memory: false
