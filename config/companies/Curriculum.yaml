background: "At Startr Team, we're reinventing education with our quirky AI crew! Our team includes a brainy AI CEO, a tech-savvy CTO, a people-loving HR officer, and a creative product whiz. Together, we're cooking up fun, easy-to-understand lessons for all subjects. Watch out, textbooks – Startr Team is here to make learning an awesome adventure!"
process:
  phases:
  - name: DemandAnalysis
    type: SimplePhase
    max_turns: 3
    reflection: true
    assistant_role: Chief Curriculum Officer
    user_role: Chief Executive Officer
    prompt: "Startr.Team has previously created products in the following formats:

      Images: Visuals like line charts, bar charts, flow charts, cloud charts, Gantt charts, etc.
      Documents: Information presented in .docx files.
      PowerPoint Presentations: Information presented in .pptx files.
      Excel Sheets: Data displayed in .xlsx files.
      PDFs: Information presented in .pdf files.
      Websites: Personal resumes, tutorials, products, or ideas in .html files.
      Applications: Visual games, software, tools, etc., developed with Python.
      Dashboards: Panels visualizing real-time information.
      Mind Maps: Ideas arranged around a core concept.
      Markdown Files: Information presented in .md files.

      As the {assistant_role}, let's focus on choosing the best product format for our project. Keep the discussion going until we decide on the modality that meets our needs.

      Remember, we're ONLY discussing the product format—nothing else. Once we've all agreed, anyone can end the discussion by replying with a single line. Start this line with `<INFO>`, followed by the chosen product format, like `<INFO> Markdown`."
  - name: ChooseLanguage
    type: SimplePhase
    max_turns: 3
    reflection: true
    assistant_role: Educational Consultant
    user_role: Chief Curriculum Officer
    prompt: 'Based on the projects'' current task and some creative ideas below:

      Task: "{task}".

      Modality: "{modality}".

      Ideas: "{ideas}".

      We must complete the task following Understanding by Design (UbD), a framework
      for curriculum development

      As the {assistant_role}, working to meet the projects'' needs, suggest a specific
      plan.

      We will only discuss the UbD curiuculum dev plan and nothing else! Once everyone
      agrees, end the discussion and provide the chosen plan in this format: ''<INFO>
      *'' where ''*'' is the plan.'
  - name: Manual
    type: SimplePhase
    max_turns: 1
    reflection: false
    assistant_role: Chief Learning Officer
    user_role: Educational Consultant
    prompt: |
      Here is the information you'll need for the project task, code, & dependencies:
      Task: "{task}".
      Modality: "{modality}".
      Programming Language: "{language}"
      Ideas: "{ideas}"
      Codes: 
      "{codes}"
      Requirements:
      "{requirements}"
      
      As the {assistant_role}, create a `manual.md` file using Markdown. This file will serve as a curriculum guide following the Understanding by Design (UbD) framework. It should include:
      - An overview of the project's main goals and objectives.
      - A description of key concepts and skills to be taught.
      - Instructions for setting up and using any required tools or resources.
      - Guidance on how to assess and reflect on the learning outcomes.
      
      Here’s an example of what your guide could look like:
      manual.md

      ```
      # Curriculum Guide: Understanding by Design (UbD) Framework
      ## Overview

      This curriculum guide is designed to help you understand and apply the UbD framework in your project.

      ## Goals and Objectives

      Define the main goals of the project and what learners should achieve.
      ## Key Concepts and Skills

      Outline the essential concepts and skills that will be covered.
      ## Setup and Resources

      Provide instructions for setting up any necessary tools and resources.

      ## Assessment and Reflection

      Include guidance on how to assess progress and reflect on learning outcomes.

      ## Example Structure

      ### 1. Goals and Objectives

      Describe what the project aims to accomplish and the learning objectives.

      ### 2. Key Concepts and Skills

      Detail the important concepts and skills that will be taught.

      ### 3. Setup and Resources

      Explain how to set up the project and any resources needed.

      ### 4. Assessment and Reflection

      Provide methods for evaluating success and reflecting on the learning process.
      ```
agents: []
settings:
  clear_structure: true
  git_management: false
  gui_design: true
  incremental_develop: false
  self_improve: false
  web_spider: false
  with_memory: false
