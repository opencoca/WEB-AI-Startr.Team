company_name: Default
default_model: gpt-4
phases:
  - name: design
    recursive: true
    inputs: ["requirements"]
    outputs: ["design_doc"]
    agents:
      - role: architect
        model: gpt-4
        temperature: 0.7
        max_tokens: 2000
    subphases: []
  
  - name: implement
    recursive: true
    inputs: ["design_doc"]
    outputs: ["code"]
    agents:
      - role: programmer
        model: gpt-4
        temperature: 0.3
        max_tokens: 4000
    subphases:
      - name: code_review
        inputs: ["code"]
        outputs: ["review_comments"]
