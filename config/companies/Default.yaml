background: Startr.Team is a software company powered by multiple intelligent agents,
  such as chief executive officer, chief human resources officer, chief product officer,
  chief technology officer, etc, with a multi-agent organizational structure and the
  mission of 'changing the digital world through programming'.
process:
  phases:
  - name: DemandAnalysis
    type: SimplePhase
    max_turns: -1
    reflection: true
    assistant_role: Chief Product Officer
    user_role: Chief Executive Officer
    prompt: "Startr.Team has created products in these forms before:\n \nImage: Information\
      \ presented as iluatrations or in line, bar, flow, cloud, etc.\nGANT: Information\
      \ presented in a GANT chart (This is useful timeline information).\nDocument:\
      \ Information presented via .markdown files.\nPowerPoint: Information presented\
      \ via .pptx files.\nExcel: Information presented via .xlsx files.\nPDF: Information\
      \ presented via .pdf files.\nWebsite: Personal resumes, tutorials, products,\
      \ or ideas presented via .html files.\nApplication: Visualized games, software,\
      \ or tools implemented via Python.\nDashboard: Real-time information displayed\
      \ on a panel.\nMind Map: Ideas represented with related concepts around a core\
      \ concept.\n \nAs our {assistant_role}, working to meet our new user's demand(s)\
      \ and ensuring the product\nis feasible let us discuss which product modality\
      \ we should implement.\n \n**NOTE**: ONLY discuss the product modality and nothing\
      \ else!\nOnce we all agree, any of us must end the discussion by replying with\
      \ one info line specifying the modality.\n**EXAMPLE** '<INFO>Website' in this\
      \ eample the modality of Website was chosen as a website was the best option."
  - name: ChooseLanguage
    type: SimplePhase
    max_turns: -1
    reflection: true
    assistant_role: Chief Technology Officer
    user_role: Chief Executive Officer
    prompt: "According to user's task and some creative brainstorm ideas listed below:\
      \ \nTask: \"{task}\".\nModality: \"{modality}\".\nIdeas: \"{ideas}\".\nWe have\
      \ decided to complete the task. \nAs the {assistant_role}, working to satisfy\
      \ the new user's demand and make the software\nrealizable, you should propose\
      \ a concrete programming language, or stack.\n\nIf the project can be built\
      \ in html, css, and, Javascript start there.\nIf python can is a better option\
      \ to complete this task please answer Python;\notherwise, answer another with\
      \ another programming language (e.g., Java, C++, etc,).\n\n**Note** that we\
      \ must ONLY discuss the target programming language\ndo not discuss anything\
      \ else!\nOnce we all have expressed our opinion(s) and agree with the results\
      \ of the discussion\nunanimously, any of us must actively terminate the discussion\
      \ and conclude the\nbest programming language we have discussed without any\
      \ other words or reasons,\n**NOTE**: ONLY discuss the product programming language\
      \ and nothing else!\nOnce we all agree, any of us must end the discussion by\
      \ replying with one info line specifying the programming language.\n**EXAMPLE**\
      \ '<INFO>Markdown' in this example the programming language of Markdown was\
      \ chosen."
  - name: Coding
    type: SimplePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: "According to the new user's task and our software designs listed below:\
      \ \nTask: \"{task}\".\nTask description: \"{description}\".\nModality: \"{modality}\"\
      .\nProgramming Language: \"{language}\"\nIdeas:\"{ideas}\"\nWe have decided\
      \ to complete the task as a {language} project, with multiple well defined\n\
      and commented {language} files.\n\nAs our {assistant_role}, working to satisfy\
      \ our new user's demands, write one or multiple files\nmake sure that every\
      \ detail of the architecture is, in the end, implemented as code. {gui}\n\n\
      Think step by step, correctly explaining your rational.\nComming to the right\
      \ decisions to make sure we get it right.\n\nYou will first lay out the names\
      \ of the core classes, functions, and any methods needed\n**NOTE** provide a\
      \ brief comment for each.\n\nThen you will output the content of each file including\
      \ complete code.\n\nEach file must strictly follow the markdown code block format,\
      \ where the following tokens\nmust be replaced so that \"FILENAME\" is the lowercase\
      \ file name including the file extension,\n\"LANGUAGE\" in the programming language,\
      \ \"DOCSTRING\" is a string literal specified in source\ncode that is used to\
      \ document a specific segment of code, and \"CODE\" is the original code:\n\n\
      FILENAME\n```LANGUAGE\n'''\nDOCSTRING\n'''\nCODE\n```\n\nYou will start with\
      \ the \"main\" or if html \"index\" file, then go to the ones that are imported\n\
      by that file, and so on.\n\n**NOTE** The code must be fully functional.\nImplement\
      \ all functions. Do not No placeholders (such as 'pass' in Python)."
  - name: CodeThisProject
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: Execute the CodeThisProject phase
    recursion:
      condition: needs_another_cycle
      max_depth: 10
      sub_phases:
      - name: CodeThis
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Chief Technology Officer
        prompt: "According to the new user's task and our software designs listed\
          \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
          \ \"{language}\"\nCodes:\n\"{codes}\"\nUnimplemented File:\n\"{unimplemented_file}\"\
          \nIn our software, each file must strictly follow a markdown code block\
          \ format,\nwhere the following tokens must be replaced such that \"FILENAME\"\
          \ is the lowercase file name including the file extension, \"LANGUAGE\"\
          \ in the programming language, \"DOCSTRING\" is a string literal specified\
          \ in source code that is used to document a specific segment of code, and\
          \ \"CODE\" is the original code:\nFILENAME\n```LANGUAGE\n'''\nDOCSTRING\n\
          '''\nCODE\n```\nAs the {assistant_role}, to satisfy the complete function\
          \ of our developed software, you have to implement all methods in the {unimplemented_file}\
          \ file which contains a unimplemented class. Now, implement all methods\
          \ of the {unimplemented_file} and all other code needed, then output the\
          \ fully implemented codes, strictly following the required format."
  - name: CodeReview
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Code Reviewer
    user_role: Programmer
    prompt: Execute the CodeReview phase
    recursion:
      condition: needs_another_cycle
      max_depth: 3
      sub_phases:
      - name: CodeReviewComment
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Code Reviewer
        user_role: Programmer
        prompt: "According to the new user's task and our software designs: \nTask:\
          \ \"{task}\".\nModality: \"{modality}\".\nProgramming Language: \"{language}\"\
          \nIdeas: \"{ideas}\"\nCodes:\n\"{codes}\"\nAs the {assistant_role}, to make\
          \ the software directly operable without further coding, Startr.Team have\
          \ formulated the following rules:\n1) all referenced classes should be imported;\n\
          2) all methods should be implemented;\n3) all methods need to have the necessary\
          \ comments;\n4) no potential bugs;\n5) The entire project conforms to the\
          \ tasks proposed by the user;\n6) most importantly, do not only check the\
          \ errors in the code, but also the logic of code. Make sure that user can\
          \ interact with generated software without losing any feature in the requirement;\n\
          Now, you should check the above rules one by one and review the project\
          \ code in detail, propose one comment with the highest priority about the\
          \ code, and give me instructions on how to fix. Tell me your comment with\
          \ the highest priority and corresponding suggestions on revision. If the\
          \ code is perfect and you have no comment for any of it, return only one\
          \ line like \"<INFO> Finished\"."
      - name: CodeReviewModification
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Code Reviewer
        prompt: "According to the new user's task, our designed product modality,\
          \ languages and ideas, our developed first-edition source code are listed\
          \ below: \nTask: \"{task}\".\nModality: \"{modality}\".\nProgramming Language:\
          \ \"{language}\"\nIdeas: \"{ideas}\"\nCodes: \n\"{codes}\"\nComments on\
          \ Codes:\n\"{comments}\"\nIn the software, each file must strictly follow\
          \ a markdown code block format,\nwhere the following tokens must be replaced\
          \ such that \"FILENAME\" is the lowercase file name including the file extension,\
          \ \"LANGUAGE\" in the programming language, \"DOCSTRING\" is a string literal\
          \ specified in source code that is used to document a specific segment of\
          \ code, and \"CODE\" is the original code. Format:\nFILENAME\n```LANGUAGE\n\
          '''\nDOCSTRING\n'''\nCODE\n```\nAs the {assistant_role}, to satisfy the\
          \ new user's demand and make the software creative, executive and robust,\
          \ you should modify corresponding code according to the comments. Then,\
          \ output the full and complete code with all bugs fixed based on the comments.\
          \ Return all code strictly following the required format."
  - name: Test
    type: RecursivePhase
    max_turns: 1
    reflection: false
    assistant_role: Programmer
    user_role: Software Test Engineer
    prompt: Execute the Test phase
    recursion:
      condition: needs_another_cycle
      max_depth: 3
      sub_phases:
      - name: TestErrorSummary
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Software Test Engineer
        prompt: "Our developed source code and corresponding test reports are listed\
          \ below: \nProgramming Language: \"{language}\"\nSource Codes:\n\"{codes}\"\
          \nTest Reports of Source Codes:\n\"{test_reports}\"\nAccording to my test\
          \ reports, please locate and summarize the bugs that cause the problem."
      - name: TestModification
        type: SimplePhase
        max_turns: 1
        reflection: false
        assistant_role: Programmer
        user_role: Software Test Engineer
        prompt: 'Our developed source code and corresponding test reports are listed
          below:

          Programming Language: "{language}"

          Source Codes:

          "{codes}"

          Test Reports of Source Codes:

          "{test_reports}"

          Error Summary of Test Reports:

          "{error_summary}"

          Each file must be in a markdown code block format:

          Replace the following tokens accordingly:

          1. "FILENAME" with the lowercase file name including the extension.

          2. "LANGUAGE" with the programming language.

          3. "DOCSTRING" with the documentation string.

          4. "CODE" with the original code.

          The format is as follows:

          FILENAME

          ```LANGUAGE

          ''''''

          DOCSTRING

          ''''''

          CODE

          ```


          As the {assistant_role_name}, your task is to modify the code based on the
          error summary to ensure smooth execution.

          Use the format above to modify the problematic code based on the error summary.

          Output the fixed code along with corresponding explanations.


          **NOTE**: Strictly follow the defined format including FILENAME, LANGUAGE,
          DOCSTRING, and CODE.

          Incomplete "TODO" code is strictly prohibited.

          If no bugs are reported, please return only one line: "<INFO> Finished".'
  - name: EnvironmentDescription
    type: SimplePhase
    max_turns: 1
    reflection: true
    assistant_role: Programmer
    user_role: Chief Technology Officer
    prompt: "The new user's task and our developed code are listed: \nTask: \"{task}\"\
      .\nModality: \"{modality}\".\nProgramming Language: \"{language}\"\nIdeas: \"\
      {ideas}\"\nCodes: \n\"{codes}\"\nAs the {assistant_role}, you should write a\
      \ requirements.txt file, which is commonly used in Python projects to specify\
      \ the dependencies or packages required for the project to run properly. It\
      \ serves as a way to document and manage the project's dependencies in a standardized\
      \ format. For example:\nrequirements.txt\n```\nnumpy==1.19.2\npandas>=1.1.4\n\
      ```\nBased on our project code and file format listed above, write a requirements.txt\
      \ file to specify the dependencies or packages required for the project to run\
      \ properly."
  - name: Manual
    type: SimplePhase
    max_turns: 1
    reflection: false
    assistant_role: Chief Product Officer
    user_role: Chief Executive Officer
    prompt: "Here\u2019s a list of our task, code base, and required dependencies:\n\
      Task: \"{task}\".\nModality: \"{modality}\".\nProgramming Language: \"{language}\"\
      \nIdeas: \"{ideas}\"\nCodes: \n\"{codes}\"\nRequirements:\n\"{requirements}\"\
      \nAs our {assistant_role}, writing in well formated Markdown, you write a README.md.\n\
      README.md must be a well formated and detailed user README. Our final README.md\n\
      should be a detailed user guide explaining how to use the software. It should\
      \ include:\n- An introduction to the main functions of the software\n- Instructions\
      \ for installing the necessary environment dependencies\n- Guidelines on how\
      \ to use or interact with the software\n\n**Example**:\n**Example**:\nREADME.md\n\
      ```markdown\n# LangChain\nBuilding applications with LLMs through composability\n\
      Looking for the JS/TS version? Check out LangChain.js.\n**Production Support:**\
      \ As you move your LangChains into production,\nwe'd love to offer more comprehensive\
      \ support.\n\nPlease fill out this form and we'll set up a dedicated support\
      \ Slack channel.\n\n## Quick Install\n`pip install langchain`\nor\n`conda install\
      \ langchain -c conda-forge`\n\n## \U0001F914 What is this?\n\nLarge language\
      \ models (LLMs) are emerging as a transformative technology, enabling developers\n\
      to build applications that they previously could not. However, using these LLMs\
      \ in isolation is\noften insufficient for creating powerful apps\n*real* power\
      \ comes when you can combine them with other sources of computation or knowledge.\n\
      \nThis library aims to assist in the development of those types of applications.\n\
      Common examples of these applications include:\n\n**\u2753 Question Answering\
      \ over specific documents**\n\n- Documentation\n- End-to-end Example: Question\
      \ Answering over Notion Database\n\n**\U0001F916 Agents**\n- Documentation\n\
      - End-to-end Example: GPT+WolframAlpha\n\n## \U0001F4D6 Documentation\n\nPlease\
      \ see [here](https://startr.team) for full documentation on:\n- Getting started\
      \ (installation, setting up the environment, simple examples)\n- How-To examples\
      \ (demos, integrations, helper functions)\n- Reference (full API docs)\n- Resources\
      \ (high-level explanation of core concepts)\n```"
