version: 1.0
definitions:
  phase:
    type: object
    properties:
      name: { type: string }
      recursive: { type: boolean }
      inputs: { type: array, items: { type: string } }
      outputs: { type: array, items: { type: string } }
      agents: { type: array, items: { $ref: "#/definitions/agent" } }
      subphases: { type: array, items: { $ref: "#/definitions/phase" } }

  agent:
    type: object
    properties:
      role: { type: string }
      model: { type: string }
      temperature: { type: number }
      max_tokens: { type: integer }

required:
  - phases
  - default_model
  - company_name