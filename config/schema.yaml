version: 1.0
definitions:
  phase_base:
    type: object
    required: ["phaseType"]
    properties:
      phaseType: 
        type: string
        enum: ["SimplePhase", "ComposedPhase"]
      max_turn_step: { type: integer, default: -1 }
      need_reflect: { type: boolean }

  simple_phase:
    allOf:
      - $ref: "#/definitions/phase_base"
      - type: object
        properties:
          roles:
            type: object
            required: ["assistant", "user"]
            properties:
              assistant: { type: string }
              user: { type: string }
          inputs: 
            type: array
            items: { type: string }
          outputs:
            type: array 
            items: { type: string }

  composed_phase:
    allOf:
      - $ref: "#/definitions/phase_base"
      - type: object
        required: ["cycleNum", "Composition"]
        properties:
          cycleNum: { type: integer, minimum: 1 }
          max_depth: { type: integer, minimum: 1 }
          Composition:
            type: object
            additionalProperties:
              $ref: "#/definitions/simple_phase"

  agent:
    type: object
    properties:
      model: { type: string }
      temperature: { type: number, minimum: 0, maximum: 2, default: 0.7 }
      max_tokens: { type: integer, minimum: 1, default: 2048 }
      stop_tokens: { type: array, items: { type: string } }
      system_message: { type: string }

required:
  - version
  - company_name
  - default_model
  - phase_sequence
  - phases
  - agents
  - settings

properties:
  version: { type: string }
  company_name: { type: string }
  default_model: { type: string }
  background_prompt: 
    oneOf:
      - { type: string }
      - { type: array, items: { type: string } }
  
  phase_sequence:
    type: array
    items: { type: string }
    
  phases:
    type: object
    additionalProperties:
      oneOf:
        - $ref: "#/definitions/simple_phase"
        - $ref: "#/definitions/composed_phase"
          
  agents:
    type: object
    additionalProperties:
      $ref: "#/definitions/agent"
        
  settings:
    type: object
    properties:
      clear_structure: { type: boolean, default: true }
      gui_design: { type: boolean, default: false }
      git_management: { type: boolean, default: true }
      incremental_develop: { type: boolean, default: false }
      self_improve: { type: boolean, default: true }
      with_memory: { type: boolean, default: true }
      web_spider: { type: boolean, default: false }
    additionalProperties: false