default_config: &default_config
  temperature: 0.7
  top_p: 1.0
  n: 1
  stream: false
  stop: null
  presence_penalty: 0.0
  frequency_penalty: 0.0
  is_openai: true
  max_tokens: 4096
  base_url: https://api.openai.com/v1/ 

models:
  GPT_3_5_TURBO:
    <<: *default_config
    name: "gpt-3.5-turbo-16k-0613"
    max_tokens: 16384

  GPT_3_5_TURBO_NEW:
    <<: *default_config
    name: "gpt-3.5-turbo-16k"
    max_tokens: 16384

  GPT_4:
    <<: *default_config
    name: "gpt-4o"
    max_tokens: 8192

  GPT_4_32K:
    <<: *default_config
    name: "gpt-4-32k"
    max_tokens: 32768

  GPT_4_TURBO:
    <<: *default_config
    name: "gpt-4-turbo"
    max_tokens: 100000

  GPT_4_TURBO_V:
    <<: *default_config
    name: "gpt-4-turbo"
    max_tokens: 100000

  GPT_4O:
    <<: *default_config
    name: "gpt-4o"
    max_tokens: 100000

  GTP_4O_MINI:
    <<: *default_config
    name: "gpt-4o-mini"
    max_tokens: 100000

  STUB:
    <<: *default_config
    name: "stub"
    max_tokens: 4096
    is_openai: false

  # Updated LLAMA_3 configuration with fallback to a supported model
  # Original configuration caused "model not found" errors
  LLAMA_3:
    <<: *default_config
    # Using gpt-4 as fallback since llama-3.3-70b-versatile is not accessible
    name: "gpt-4o"
    max_tokens: 8192
    is_openai: true
    # Using default OpenAI base URL instead of Groq
    # Comment out this fallback and uncomment the next section if you have Groq access
    
  # Original LLAMA_3 configuration - uncomment if you have Groq API access
  # LLAMA_3_GROQ:
  #   <<: *default_config
  #   name: "llama-3.1-70b-versatile"  # Updated to latest available model
  #   max_tokens: 4096
  #   is_openai: true
  #   base_url: https://api.groq.com/openai/v1 